<!DOCTYPE html><html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaper Samurai — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 16px;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #bbb; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      color: white;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #d5a33b;
      color: #111;
      font-weight: bold;
    }
    #message { font-size: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>侍 Vaper Samurai</h1>
    <p>Admin Panel</p>
    <form id="login">
      <label for="email">E-mel admin</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Kata laluan</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log masuk</button>
    </form>
    <p id="message">Sambungan login belum dikonfigurasi.</p>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('message').textContent =
        'Login belum disambungkan. Jangan masukkan kata laluan sebenar di halaman ini.';
    });
  </script>
</body>
</html>
